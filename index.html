const blob=JSON.parse($("#blob").textContent);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const fmt=n=>n.toLocaleString("en-US");
const el=(t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
async function decrypt(pass){
const enc=new TextEncoder();
const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(blob.salt),iterations:blob.it,hash:"SHA-256"},
base,{name:"AES-GCM",length:256},false,["decrypt"]);
const out=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(blob.iv)},key,b64(blob.ct));
return JSON.parse(new TextDecoder().decode(out));
}
$("#lockform").addEventListener("submit",async e=>{
e.preventDefault();
const btn=$("#go"), err=$("#err");
err.textContent=""; btn.disabled=true; btn.textContent="Opening";
try{ const d=await decrypt($("#pw").value); render(d); $("#lock").remove(); }
catch(_){ err.textContent="That one’s not it — have another go."; btn.disabled=false; btn.textContent="Come in"; $("#pw").select(); }
});
const tip=$("#tip");
function bindTip(n,html){
n.addEventListener("pointerenter",()=>{tip.innerHTML=html; tip.style.opacity="1";});
n.addEventListener("pointermove",ev=>{
const p=14,w=tip.offsetWidth,h=tip.offsetHeight;
let x=ev.clientX+p,y=ev.clientY+p;
if(x+w>innerWidth-10) x=Math.max(10,ev.clientX-w-p);
if(y+h>innerHeight-10) y=Math.max(10,ev.clientY-h-p);
tip.style.left=x+"px"; tip.style.top=y+"px";
});
n.addEventListener("pointerleave",()=>{tip.style.opacity="0";});
n.tabIndex=0;
n.addEventListener("focus",()=>{const r=n.getBoundingClientRect();tip.innerHTML=html;tip.style.opacity="1";tip.style.left=r.left+"px";tip.style.top=(r.bottom+10)+"px";});
n.addEventListener("blur",()=>{tip.style.opacity="0";});
}
function legend(items){
const l=el("div","legend");
items.forEach(([cls,color,label])=>{
const k=el("span","k"); const i=el("i",cls); i.style.background=color;
k.appendChild(i); k.appendChild(el("span",null,label)); l.appendChild(k);
});
return l;
}
function axis(l,c,r){
const a=el("div","axis");
a.appendChild(el("span",null,l));
a.appendChild(el("span","c",c));
a.appendChild(el("span","r",r));
return a;
}
function section(n,title,dek){
const s=el("section");
const h=el("div","shead");
h.appendChild(el("span","snum",n));
h.appendChild(el("h2",null,title));
s.appendChild(h);
if(dek) s.appendChild(el("p","sdek",dek));
return s;
}
function render(d){
const app=$("#app"); app.hidden=false;
const T=d.totals,M=d.meta,C=d.copy;
const daysLeft=Math.max(0,Math.ceil((new Date(M.endISO)-new Date())/864e5));
const ban=el("div","banner");
ban.appendChild(el("div","art")); ban.appendChild(el("div","fade"));
app.appendChild(ban);
const wrap=el("div","wrap"); app.appendChild(wrap);
const head=el("header");
const mast=el("div","mast");
const left=el("div"); left.style.minWidth="0";
left.appendChild(el("div","eyebrow",M.start+" &rarr; "+M.end));
left.appendChild(el("h1","title","Baddie Baddie<br>Step o&rsquo; <em>Clock</em>"));
const meta=el("div","mastmeta");
[["Days to go",String(daysLeft),""],["The pot","$"+M.pot,"hi"],["Walking",M.participants+" of "+M.roster,""]]
.forEach(([l,v,cls])=>{
const m=el("div","mm");
m.appendChild(el("div","eyebrow",l));
m.appendChild(el("b",cls,v));
meta.appendChild(m);
});
mast.appendChild(left); mast.appendChild(meta);
head.appendChild(mast);
head.appendChild(el("p","tagline",C.tagline));
wrap.appendChild(head);
const hero=el("div","hero");
hero.appendChild(el("div","herofig",fmt(T.steps)));
hero.appendChild(el("div","herounit","steps between us &middot; "+T.miles+" mi &middot; "+T.km+" km"));
wrap.appendChild(hero);
const kp=el("div","kpis");
[[fmt(T.avgDaily),"Average steps per person per day. The middle of the pack does "+fmt(T.medDaily)+"."],
[Math.round(T.goalDays/T.personDays*100)+"%",T.goalDays+" of "+T.personDays+" person-days cleared that person&rsquo;s own goal."],
["−"+Math.round((1-d.weekendAvg/d.weekdayAvg)*100)+"%","The weekend drop. "+fmt(d.weekdayAvg)+" steps on a weekday, "+fmt(d.weekendAvg)+" on Sat and Sun."],
[T.spread+"×","Between first and last place over six days. It is a wide field."]
].forEach(([v,l])=>{
const k=el("div","kpi");
k.appendChild(el("div","v",v));
k.appendChild(el("div","l",l));
kp.appendChild(k);
});
wrap.appendChild(kp);
const inj=el("div","injury");
const il=el("div");
il.appendChild(el("div","eyebrow","Resting up"));
il.appendChild(el("div","who",C.injuryName));
il.appendChild(el("p","body",C.injuryBody));
const ir=el("div");
ir.appendChild(el("div","tag",C.injuryTag));
ir.appendChild(el("span","toes",C.injuryStat));
inj.appendChild(il); inj.appendChild(ir);
wrap.appendChild(inj);
const byTotal=d.rows.slice().sort((a,b)=>b.total-a.total);
const s1=section("01","The standings",C.s1);
s1.appendChild(legend([["sw","var(--terra)","Steps a day"],["swl","var(--navy-mark)","Their goal"]]));
const max1=14000, r1=el("div","rows");
byTotal.forEach((r,i)=>{
const row=el("div","row");
row.appendChild(el("div","rk",String(i+1)));
row.appendChild(el("div","nm",r.name));
const tr=el("div","track");
const bar=el("div","bar"); bar.style.width=(r.avg/max1*100).toFixed(1)+"%"; tr.appendChild(bar);
const tk=el("div","tick"); tk.style.left="calc("+(r.goal/max1*100).toFixed(1)+"% - 1px)"; tr.appendChild(tk);
bindTip(tr,"<b>"+r.name+"</b>"+fmt(r.avg)+" steps a day &middot; goal "+fmt(r.goal)+"<br>"+r.pct+"% of it, cleared on "+r.over+" of 6 days<br>"+fmt(r.total)+" steps in all &middot; "+r.mi+" mi");
row.appendChild(tr);
row.appendChild(el("div","val",fmt(r.avg)));
r1.appendChild(row);
});
s1.appendChild(r1); s1.appendChild(axis("0","7,000","14,000"));
wrap.appendChild(s1);
const byPct=d.rows.slice().sort((a,b)=>b.pct-a.pct);
const s2=section("02","Against your own goal",C.s2);
s2.appendChild(legend([["sw","var(--navy)","At or over goal"],["sw","var(--terra)","Under goal"]]));
const span=60, r2=el("div","rows");
byPct.forEach((r,i)=>{
const row=el("div","row");
row.appendChild(el("div","rk",String(i+1)));
row.appendChild(el("div","nm",r.name));
const tr=el("div","dvtrack"); tr.appendChild(el("div","dvmid"));
const dev=Math.max(-span,Math.min(span,r.pct-100)), half=Math.abs(dev)/span*50;
const b=el("div","dvbar "+(dev>=0?"up":"dn"));
if(dev>=0){b.style.left="50%";} else {b.style.left=(50-half).toFixed(1)+"%";}
b.style.width=half.toFixed(1)+"%";
tr.appendChild(b);
bindTip(tr,"<b>"+r.name+"</b>"+r.pct+"% of a "+fmt(r.goal)+" goal<br>cleared it on "+r.over+" of 6 days");
row.appendChild(tr);
const v=el("div","val",r.pct+"%"); v.style.color=dev>=0?"var(--navy-ink)":"var(--terra-ink)";
row.appendChild(v); r2.appendChild(row);
});
s2.appendChild(r2); s2.appendChild(axis("50%","goal","150%"));
wrap.appendChild(s2);
const s3=section("03","The weekend dip",C.s3);
s3.appendChild(legend([["sw","var(--taupe)","Weekday"],["sw","var(--terra)","Weekend"]]));
const maxc=10000, cols=el("div","cols");
d.byDayAvg.forEach((v,i)=>{
const isWk=d.dayNames[i]==="Sat"||d.dayNames[i]==="Sun";
const w=el("div","colwrap");
w.appendChild(el("div","colv",fmt(v)));
const c=el("div","col"+(isWk?" wk":"")); c.style.height="calc("+(v/maxc*100).toFixed(1)+"% - 28px)";
bindTip(c,"<b>"+d.dayNames[i]+" "+d.dayLabels[i]+"</b>"+fmt(v)+" steps each, on average<br>"+fmt(d.byDayTotal[i])+" across the group");
w.appendChild(c); cols.appendChild(w);
});
s3.appendChild(cols);
const cg=el("div","colgrid");
d.dayNames.forEach((n,i)=>cg.appendChild(el("div","collab",n+"<br>"+d.dayLabels[i])));
s3.appendChild(cg);
wrap.appendChild(s3);
const byCv=d.rows.slice().sort((a,b)=>a.cv-b.cv);
const s4=section("04","Steady or spiky",C.s4);
const max4=22000, r4=el("div","rows");
byCv.forEach(r=>{
const row=el("div","row rg");
row.appendChild(el("div","nm",r.name));
const tr=el("div","rgtrack");
const sp=el("div","rgspan");
sp.style.left=(r.worst/max4*100).toFixed(1)+"%"; sp.style.width=((r.best-r.worst)/max4*100).toFixed(1)+"%";
tr.appendChild(sp);
const dot=el("div","rgdot"); dot.style.left=(r.avg/max4*100).toFixed(1)+"%"; tr.appendChild(dot);
bindTip(tr,"<b>"+r.name+"</b>quietest "+fmt(r.worst)+" &middot; best "+fmt(r.best)+"<br>average "+fmt(r.avg)+" &middot; swing &plusmn;"+r.cv+"%");
row.appendChild(tr);
row.appendChild(el("div","val",fmt(r.worst)+"&ndash;"+fmt(r.best)));
r4.appendChild(row);
});
s4.appendChild(r4); s4.appendChild(axis("0","11,000","22,000"));
wrap.appendChild(s4);
const s5=section("05","Every number",C.s5);
const tw=el("div","tablewrap"), tb=el("table");
const heads=["#","Name","Total","Avg/day","Goal","% goal","Goal days","Best","Quietest","Swing","Miles"];
tb.innerHTML="<thead><tr>"+heads.map(h=>"<th>"+h+"</th>").join("")+"</tr></thead>";
const body=el("tbody");
byTotal.forEach((r,i)=>{
const tr=document.createElement("tr");
tr.innerHTML="<td>"+(i+1)+"</td><td>"+r.name+"</td><td>"+fmt(r.total)+"</td><td>"+fmt(r.avg)+"</td><td>"+fmt(r.goal)+
"</td><td class='"+(r.pct>=100?"pos":"neg")+"'>"+r.pct+"%</td><td>"+r.over+" / 6</td><td>"+fmt(r.best)+"</td><td>"+fmt(r.worst)+
"</td><td>&plusmn;"+r.cv+"%</td><td>"+r.mi+"</td>";
body.appendChild(tr);
});
tb.appendChild(body); tw.appendChild(tb); s5.appendChild(tw);
wrap.appendChild(s5);
const f=el("footer");
f.innerHTML="<p><span class='pill'>Warm-up, not scoring</span></p>"+
"<p>The challenge proper runs <b>"+M.start+" to "+M.end+"</b>. This page covers <b>"+M.window+"</b>, so none of it counts toward the pot.</p>"+
"<p>"+C.footNote+"</p>"+
"<p>Everything here is unlocked in your own browser. Nothing is saved, and none of these numbers leave your phone.</p>";
wrap.appendChild(f);
}
})();
</script>
</body>
</html>
